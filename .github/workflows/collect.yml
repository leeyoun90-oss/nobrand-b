name: AI 트렌드 수집

on:
  schedule:
    - cron: "17 23 * * *"   # 매일 한국 시간 오전 8:17
  workflow_dispatch:         # Actions 탭에서 "Run workflow" 버튼으로 바로 실행
    inputs:
      days:
        description: "최근 며칠 치를 수집할지"
        default: "7"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py --days "${{ github.event.inputs.days || '7' }}"

      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          if git diff --cached --quiet; then
            echo "새로 수집된 내용이 없습니다."
          else
            git commit -m "data: AI 트렌드 수집 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
